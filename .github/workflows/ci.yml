name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Scan for committed secrets
        run: |
          npx --yes \
            --package secretlint \
            --package @secretlint/secretlint-rule-aws \
            --package @secretlint/secretlint-rule-github-token \
            --package @secretlint/secretlint-rule-slack \
            --package @secretlint/secretlint-rule-stripe \
            secretlint "**/*"
